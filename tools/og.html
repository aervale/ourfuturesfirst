<!doctype html>
<!-- The link preview image (og.png): the star beside the slogan, set like the site's headline, with the second phrase in the star's gold.
     It reads the headline's font, weight, colours and line spacing from index.html, so it always matches the site.
     To make og.png: serve the repo (any static server), open /tools/og.html in a browser at 1200x630 and screenshot it,
     e.g. chrome --headless --window-size=1200,630 --screenshot=og.png http://localhost:4177/tools/og.html
     Then bump ?v= on og.png in index.html and in functions/_middleware.js (PREVIEW). -->
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;background:#0C0C0E;overflow:hidden}
.card{box-sizing:border-box;width:1200px;height:630px;padding:0 44px;display:flex;align-items:center;gap:44px}
.card img{flex:none;width:460px;height:460px}
h1{margin:0;font-size:90px;line-height:1.05;white-space:nowrap}
h1 em{font-style:normal}
iframe{position:absolute;left:-9999px;width:1200px;height:800px;border:0}
</style></head>
<body>
<div class="card"><img src="../assets/star.svg" alt="">
  <h1 id="h">One letter.<br>Every campus.<br><em>Our voice on the<br>future of AI.</em></h1>
</div>
<iframe id="site" src="../index.html" aria-hidden="true"></iframe>
<script>
/* copy the headline's look from the site once it has loaded */
document.getElementById("site").addEventListener("load", function () {
  var doc = this.contentDocument, src = doc.querySelector(".banner h1") || doc.querySelector("h1");
  if (!src) return;
  var a = getComputedStyle(src), em = src.querySelector("em"), b = em ? getComputedStyle(em) : a, h = document.getElementById("h");
  ["fontFamily", "fontWeight", "fontStretch", "letterSpacing", "color", "textTransform"].forEach(function (k) { h.style[k] = a[k]; });
  document.body.style.background = getComputedStyle(doc.body).backgroundColor;
  /* the second phrase in the site's gold (--star, the colour of the star), not the headline's red */
  var gold = getComputedStyle(doc.documentElement).getPropertyValue("--star").trim();
  h.querySelector("em").style.color = gold || b.color;
});
</script>
</body></html>
